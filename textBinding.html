<!DOCTYPE html>
<html>
  <head>
    <title>KO Real-Time Text Binding</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/knockout/3.4.0/knockout-min.js"></script>
  </head>
  <body>
    <input type="text" data-bind="value: msg, valueUpdate: 'input'" placeholder="Type your message here..." />
    <h1 data-bind="text: msg"></h1>
    <script>
      function TextViewModel() {
        this.msg = ko.observable('');
      }

      ko.applyBindings(new TextViewModel());
    </script>
  </body>
</html>
